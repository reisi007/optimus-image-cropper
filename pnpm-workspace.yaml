packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  canvas: true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@openng/optimus-ui-locale@1.0.0'
  - '@openng/optimus-ui-motion@1.0.0'
  - '@openng/optimus-ui-styled@1.0.0'
  - '@openng/optimus-ui-styles@1.0.0'
  - '@openng/optimus-ui-themes@1.0.0'
  - '@openng/optimus-ui-utils@1.0.0'
  - '@openng/optimus-ui@1.0.0'
