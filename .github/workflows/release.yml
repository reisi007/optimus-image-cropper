name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: pnpm nx build optimus-image-cropper
      - run: pnpm nx test optimus-image-cropper
      - run: pnpm nx lint optimus-image-cropper
      - run: pnpm nx build demo
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config=apps/demo-e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/demo-e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  publish:
    needs: [test-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Publish to npm
        run: |
          cd dist/packages/optimus-image-cropper
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
