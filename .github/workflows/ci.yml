name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: pnpm nx test optimus-image-cropper
      - run: pnpm nx lint optimus-image-cropper
      - run: pnpm nx build optimus-image-cropper

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build optimus-image-cropper
      - run: pnpm nx build demo
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config=apps/demo-e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/demo-e2e/playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: demo-dist
          path: dist/apps/demo/browser
          retention-days: 1

  deploy-demo:
    if: github.ref == 'refs/heads/main'
    needs: [test-and-lint, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build optimus-image-cropper
      - run: pnpm nx build demo --base-href=/
      - uses: actions/configure-pages@v5
        id: configure-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/apps/demo/browser
      - uses: actions/deploy-pages@v4
        id: deployment
